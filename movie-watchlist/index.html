<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"> 
    </head>
    <body>
        <header>
            <h1>Find your film</h1>
            <h4><a href="watchlist.html">My Watchlist</a></h4>
        </header>
        <main>
            <div class="search-bar" id="search-bar">
                <svg class="search-icon" width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M18.75 6.25C11.8464 6.25 6.25 11.8464 6.25 18.75C6.25 25.6536 11.8464 31.25 18.75 31.25C25.6536 31.25 31.25 25.6536 31.25 18.75C31.25 11.8464 25.6536 6.25 18.75 6.25ZM0 18.75C0 8.39466 8.39466 0 18.75 0C29.1053 0 37.5 8.39466 37.5 18.75C37.5 22.7995 36.2163 26.5491 34.0336 29.6142L49.0847 44.6653C50.3051 45.8857 50.3051 47.8643 49.0847 49.0847C47.8643 50.3051 45.8857 50.3051 44.6653 49.0847L29.6142 34.0336C26.5491 36.2163 22.7995 37.5 18.75 37.5C8.39466 37.5 0 29.1053 0 18.75Z" fill="white"/>
                </svg>
                <input 
                id="movie-input"
                type="text"
                placeholder="Search for a movie"/>
                <button id="search-btn" class="search-btn">Search</button>
            </div>
            <div id="results-placeholder" class="results-placeholder">
                <svg class="movie-icon" width="70" height="62" viewBox="0 0 70 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M8.75 0C3.91751 0 0 3.9175 0 8.75V52.5C0 57.3325 3.91751 61.25 8.75 61.25H61.25C66.0825 61.25 70 57.3325 70 52.5V8.75C70 3.9175 66.0825 0 61.25 0H8.75ZM21.875 8.75H48.125V26.25H21.875V8.75ZM56.875 43.75V52.5H61.25V43.75H56.875ZM48.125 35H21.875V52.5H48.125V35ZM56.875 35H61.25V26.25H56.875V35ZM61.25 17.5V8.75H56.875V17.5H61.25ZM13.125 8.75V17.5H8.75V8.75H13.125ZM13.125 26.25H8.75V35H13.125V26.25ZM8.75 43.75H13.125V52.5H8.75V43.75Z" fill="#DFDDDD"/>
                </svg>
                <h2>Start exploring</h2>
            </div>
            <div id="movie-not-found-msg" class="hidden results-placeholder">
                <h2>Unable to find what you're looking for. Please try another search</h2>
            </div>
            <div id="search-results"></div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
